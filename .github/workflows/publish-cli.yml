name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (unchecked publishes to npm, pushes a git tag and creates a GitHub release)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-cli
  cancel-in-progress: false

env:
  PNPM_VERSION: '10.30.0'

jobs:
  publish:
    name: Publish @solana/mcp
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test:integration

      - name: Publish to npm
        id: npm_publish
        uses: solana-foundation/github-actions/npm-publish@d1e779ca332fc499507fadf97d9c780ffed5a71f
        with:
          package: '@solana/mcp'
          package-directory: cli
          node-version: '24'
          pnpm-version: ${{ env.PNPM_VERSION }}
          check-version-available: ${{ !inputs.dry-run }}
          dry-run: ${{ inputs.dry-run }}

      - name: Tag and release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.npm_publish.outputs.version }}
        run: |
          gh release create "cli-v$VERSION" --target "$GITHUB_SHA" --title "@solana/mcp v$VERSION" \
            --notes "https://www.npmjs.com/package/@solana/mcp/v/$VERSION"
