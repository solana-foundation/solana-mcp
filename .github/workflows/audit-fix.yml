name: Audit Fix

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: audit-fix
  cancel-in-progress: false

env:
  PNPM_VERSION: '10.30.0'

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Override vulnerable pnpm packages
        run: |
          pnpm audit --audit-level=high --fix || true
          pnpm install --lockfile-only

      - name: Verify audit passes
        run: pnpm audit:security

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: fix/audit-advisories
          delete-branch: true
          sign-commits: true
          commit-message: 'fix(deps): resolve pnpm audit advisories'
          title: 'fix(deps): resolve pnpm audit advisories'
          body: |
            Automated by the `Audit Fix` workflow: `pnpm audit --fix` adds overrides for vulnerable packages, then the audits re-run clean.

            Approve the pending workflow runs to start CI, and review forced overrides for major-version jumps before merging.
